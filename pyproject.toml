[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-autopilot-client"
version = "0.1.0"
description = "Python client SDK for the LLM Cost Autopilot adaptive routing API"
authors = [{ name = "Harshini A" }]
requires-python = ">=3.9"
dependencies = [
    "google-genai>=1.47.0",
    "httpx>=0.28.1",
    "requests>=2.28",
    "sentence-transformers>=5.1.2",
    "supabase[async]>=2.31.0",
]

[tool.setuptools.packages.find]
include = ["llm_cost_autopilot_client*"]
