[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-cost-autopilot-client"
version = "0.1.0"
description = "Python client SDK for the LLM Cost Autopilot adaptive routing API"
authors = [{ name = "Harshini A" }]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28"
]

[tool.setuptools.packages.find]
include = ["llm_cost_autopilot_client*"]